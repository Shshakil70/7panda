<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; font-size: 20px;">
<div id="root">স্ক্রিপ্ট লোড হচ্ছে... (এটা যদি বদলে না যায়, স্ক্রিপ্ট ব্লক হচ্ছে)</div>
<script type="text/babel">
try {
  ReactDOM.createRoot(document.getElementById("root")).render(
    <div style={{color: "green", fontWeight: "bold"}}>
      ✅ সব ঠিক আছে! React, ReactDOM, Babel — তিনটাই লোড হয়েছে।
    </div>
  );
} catch (e) {
  document.getElementById("root").innerHTML = "❌ এরর হয়েছে: " + e.message;
}
</script>
</body>
</html>
