<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ============ এখানে আপনার Firebase কনফিগ বসান ============ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
};
/* ============================================================ */

const BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

function buildDefaultData() {
  const mkMember = (n, i) => ({ id: "m" + i, name: "সদস্য " + n, phone: "", address: "", documents: [], nomineeName: "", nomineeDetails: "", nomineeDocuments: [], passcode: "", active: true, joinedYear: null, joinedMonthIndex: null });
  return {
    members: [1,2,3,4,5,6,7].map((n,i) => mkMember(["১","২","৩","৪","৫","৬","৭"][i], i+1)),
    monthlyAmount: 50,
    boostAmount: 200,
    admins: [
      { id: "admin1", name: "অ্যাডমিন ১", pin: "7777" },
      { id: "admin2", name: "অ্যাডমিন ২", pin: "7778" },
    ],
    pendingRequests: [],
    months: [],
    boosts: [],
    customs: [],
    cashiers: [],
    notes: [],
  };
}

// পুরনো ডেটা (একটামাত্র adminPin) থাকলে নতুন দুই-অ্যাডমিন কাঠামোতে রূপান্তর করে
function migrateData(raw) {
  if (!raw) return raw;
  if (!raw.cashiers) raw.cashiers = [];
  raw.cashiers = raw.cashiers.map((c) => ({ ...c, transactions: c.transactions || [] }));
  if (raw.admins && raw.admins.length >= 2) {
    if (!raw.pendingRequests) raw.pendingRequests = [];
    return raw;
  }
  const oldPin = raw.adminPin || "7777";
  raw.admins = [
    { id: "admin1", name: "অ্যাডমিন ১", pin: oldPin },
    { id: "admin2", name: "অ্যাডমিন ২", pin: "7778" },
  ];
  raw.pendingRequests = raw.pendingRequests || [];
  delete raw.adminPin;
  return raw;
}

function money(n) { return "S$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function hashRot(str) { let h = 0; for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) | 0; return (Math.abs(h) % 12) - 6; }
function memberJoinedBy(member, year, monthIndex) {
  if (member.joinedYear == null) return true;
  if (year > member.joinedYear) return true;
  if (year < member.joinedYear) return false;

function makeLocalAdapter(key) {
  let handler = null;
  function read() { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function onStorage(e) { if (e.key === key && handler) handler({ val: () => read() }); }
  window.addEventListener("storage", onStorage);
  return {
    on(event, cb, errCb) { handler = cb; cb({ val: () => read() }); },
    off() { window.removeEventListener("storage", onStorage); handler = null; },
    set(val) { try { localStorage.setItem(key, JSON.stringify(val)); if (handler) handler({ val: () => val }); return Promise.resolve(true); } catch (e) { return Promise.reject(e); } },
  };
}

  function removeCashier(id) {
    if (!window.confirm("এই ক্যাশিয়ারের তথ্য মুছে ফেলতে চান?")) return;
    persist({ ...data, cashiers: (data.cashiers || []).filter((c) => c.id !== id) });
  }

  function cashierBalance(cashier) {
    return (cashier.transactions || []).reduce((sum, t) => t.type === "deposit" ? sum + t.amount : sum - t.amount, 0);
  }

  function addCashierTxn(cashierId) {
    const draft = cashierTxnDrafts[cashierId] || { type: "deposit", amount: "", note: "", targetId: "" };
    const amt = Number(draft.amount) || 0;
    if (amt <= 0) { setCashierTxnError({ ...cashierTxnError, [cashierId]: "সঠিক পরিমাণ দিন।" }); return; }
    setCashierTxnError({ ...cashierTxnError, [cashierId]: "" });

    if (draft.type === "transfer") {
      if (!draft.targetId) { setCashierTxnError({ ...cashierTxnError, [cashierId]: "কোন ক্যাশিয়ারে স্থানান্তর করবেন সিলেক্ট করুন।" }); return; }
      const target = data.cashiers.find((c) => c.id === draft.targetId);
      const source = data.cashiers.find((c) => c.id === cashierId);
      const now = Date.now();
      const outTxn = { id: "txn_" + now + "_o", type: "withdraw", amount: amt, note: `${target.name}-এর কাছে স্থানান্তর${draft.note ? " — " + draft.note : ""}`, createdAt: now };
      const inTxn = { id: "txn_" + now + "_i", type: "deposit", amount: amt, note: `${source.name}-এর কাছ থেকে স্থানান্তর${draft.note ? " — " + draft.note : ""}`, createdAt: now };
      const cashiers = data.cashiers.map((c) => {
        if (c.id === cashierId) return { ...c, transactions: [...(c.transactions || []), outTxn] };
        if (c.id === draft.targetId) return { ...c, transactions: [...(c.transactions || []), inTxn] };
        return c;
      });
      persist({ ...data, cashiers });
    } else {
      const txn = { id: "txn_" + Date.now(), type: draft.type, amount: amt, note: draft.note.trim(), createdAt: Date.now() };
      const cashiers = data.cashiers.map((c) => c.id === cashierId ? { ...c, transactions: [...(c.transactions || []), txn] } : c);
      persist({ ...data, cashiers });
    }
    setCashierTxnDrafts({ ...cashierTxnDrafts, [cashierId]: { type: "deposit", amount: "", note: "", targetId: "" } });
  }

  function removeCashierTxn(cashierId, txnId) {
    const cashiers = data.cashiers.map((c) => c.id === cashierId ? { ...c, transactions: (c.transactions || []).filter((t) => t.id !== txnId) } : c);
    persist({ ...data, cashiers });
  }

  function addNote() {
    if (!noteText.trim()) return;
    const note = { id: "note_" + Date.now(), author: noteAuthor.trim() || "অজানা", text: noteText.trim(), ts: Date.now() };
    persist({ ...data, notes: [...(data.notes || []), note] });
    setNoteText("");
  }
  function removeNote(id) {
    persist({ ...data, notes: (data.notes || []).filter((n) => n.id !== id) });

  function formatTs(ts) {
    const d = new Date(ts);

  }

  function copyDues() {
    const sorted = [...data.months].sort((a,b) => a.year - b.year || a.monthIndex - b.monthIndex);
    const latest = sorted[sorted.length - 1];

    const unpaid = data.members.filter((m) => m.active && memberJoinedBy(m, latest.year, latest.monthIndex) && !latest.payments[m.id]);
    let text = `7Panda — ${latest.label} এর বকেয়া তালিকা\n`;
    if (unpaid.length === 0) text += "সবাই জমা দিয়ে দিয়েছেন! 🎉";
    else unpaid.forEach((m) => { text += `• ${m.name} — ${money(latest.amount)}\n`; });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { setCopyFlash(true); setTimeout(() => setCopyFlash(false), 1800); }).catch(() => window.prompt("কপি করুন:", text));
    } else { window.prompt("কপি করুন:", text); }
  }

  const stats = useMemo(() => {

    data.months.forEach((mo) => {

        monthlyExpected += mo.amount;

        else { perMember[m.id].owedAmount += mo.amount; }

                      <div className="sp-passcode-box">
                        <label>{m.name}-এর পাসকোড {m.passcode ? "(সেট করা আছে)" : "(এখনো সেট হয়নি)"}</label>
                        {(() => {
                          const pending = (data.pendingRequests || []).find((r) => r.type === "member_passcode" && r.targetId === m.id);
                          if (pending) return <div className="sp-pending-note">⏳ পরিবর্তনের অনুরোধ আছে — অন্য অ্যাডমিনের অনুমোদনের অপেক্ষায় ({pending.approvedIds.length}/{data.admins.length})</div>;
                          return (
                            <div className="sp-inline-form">
                              <input placeholder="নতুন পাসকোড" value={passcodeDrafts[m.id] || ""} onChange={(e) => setPasscodeDrafts({ ...passcodeDrafts, [m.id]: e.target.value })} />
                              <button className="sp-mini-btn" onClick={() => trySetPasscode(m.id)}>পরিবর্তনের অনুরোধ পাঠান</button>
                            </div>
                          );
                        })()}
                      </div>
                    )}
                  </React.Fragment>
                )}

                {isAdmin && (
                  <div className="sp-member-actions">
                    <button className="sp-mini-btn sp-mini-btn-danger" onClick={() => removeMember(m.id)}>সদস্য অপসারণ</button>
                  </div>
                )}
              </div>
            );
          })}

          {isAdmin && (
            <div className="sp-add-member-card">
              <div className="sp-docs-title">নতুন সদস্য যোগ করুন</div>
              <input placeholder="নাম" value={newMemberName} onChange={(e) => setNewMemberName(e.target.value)} />
              <button className="sp-btn" onClick={addMember}>যোগ করুন</button>
            </div>
          )}
        </div>

        {formerMembers.length > 0 && (
          <div style={{ marginTop: "16px" }}>
            <button className="sp-settings-toggle" onClick={() => setShowFormer((v) => !v)}>সাবেক সদস্য ({formerMembers.length}) {showFormer ? "▲" : "▼"}</button>
            {showFormer && (
              <div className="sp-member-grid" style={{ marginTop: "10px" }}>
                {formerMembers.map((m) => {
                  const s = stats.perMember[m.id];
                  return (
                    <div key={m.id} className="sp-member-card sp-inactive">
                      <div className="sp-member-top"><div className="sp-member-name">{m.name}</div><span className="sp-tag-former">বিদায়ী</span></div>
                      <div className="sp-member-amounts"><span>মোট জমা দিয়েছিলেন: {money(s.paidAmount)}</span></div>
                      {isAdmin && <div className="sp-member-actions"><button className="sp-mini-btn" onClick={() => restoreMember(m.id)}>পুনরায় সক্রিয় করুন</button></div>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>

      </React.Fragment>
      )}

      {/* পেন্ডিং অনুমোদন — যেকোনো অ্যাডমিন লগইন থাকলেই দেখা যাবে, ট্যাব-নিরপেক্ষ */}
      {isAdmin && (data.pendingRequests || []).length > 0 && (
        <div className="sp-section">
          <h2 className="sp-h2">পেন্ডিং অনুমোদন</h2>
          <div className="sp-h2-sub">নিরাপত্তা পরিবর্তনে দুই অ্যাডমিনের সম্মতি লাগে</div>
          <div className="sp-notes-list">
            {data.pendingRequests.map((r) => {
              const alreadyApprovedByMe = r.approvedIds.includes(currentAdminId);
              return (
                <div key={r.id} className="sp-note-item sp-pending-item">
                  <div className="sp-note-item-top">
                    <span className="sp-note-author">{r.label}</span>
                    <span className="sp-note-ts">{r.requestedByName} অনুরোধ করেছেন · {r.approvedIds.length}/{data.admins.length} অনুমোদিত</span>
                  </div>
                  {alreadyApprovedByMe ? (
                    <div className="sp-pending-note">✓ আপনি অনুমোদন করেছেন — অন্য অ্যাডমিনের অপেক্ষায়</div>
                  ) : (
                    <div className="sp-edit-row-actions" style={{ marginTop: "8px" }}>
                      <button className="sp-mini-btn" onClick={() => approveRequest(r.id)}>অনুমোদন করুন</button>
                      <button className="sp-mini-btn sp-mini-btn-danger" onClick={() => rejectRequest(r.id)}>বাতিল করুন</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ADMIN SETTINGS */}
      {isAdmin && (
        <div className="sp-section">
          <button className="sp-settings-toggle" onClick={() => setShowSettings((v) => !v)}>⚙ সেটিংস {showSettings ? "▲" : "▼"}</button>
          {showSettings && (
            <div className="sp-settings-panel">
              <div className="sp-settings-row"><label>ডিফল্ট মাসিক চাঁদা</label>
                <div className="sp-inline-form"><input type="number" value={data.monthlyAmount} onChange={(e) => updateMonthlyAmount(e.target.value)} /><span className="sp-suffix">S$ / জন</span></div>
              </div>
              <div className="sp-settings-row"><label>ডিফল্ট বার্ষিক বুস্ট</label>
                <div className="sp-inline-form"><input type="number" value={data.boostAmount || 0} onChange={(e) => updateBoostAmount(e.target.value)} /><span className="sp-suffix">S$ / জন</span></div>
              </div>
              <div className="sp-settings-row">
                <label>লগইন পিন পরিবর্তন (দুই অ্যাডমিনের সম্মতি লাগবে)</label>
                {data.admins.map((a) => {
                  const pending = (data.pendingRequests || []).find((r) => r.type === "admin_pin" && r.targetId === a.id);
                  return (
                    <div key={a.id} style={{ marginBottom: "10px" }}>
                      <div className="sp-suffix" style={{ marginBottom: "4px" }}>{a.name} {a.id === currentAdminId ? "(আপনি)" : ""}</div>
                      {pending ? (
                        <div className="sp-pending-note">⏳ পরিবর্তনের অনুরোধ আছে — {pending.approvedIds.length}/{data.admins.length} অনুমোদিত</div>
                      ) : (
                        <div className="sp-inline-form">
                          <input type="text" placeholder="নতুন পিন (কমপক্ষে ৪ ডিজিট)" value={adminPinDrafts[a.id] || ""} onChange={(e) => setAdminPinDrafts({ ...adminPinDrafts, [a.id]: e.target.value })} />
                          <button className="sp-btn" onClick={() => requestAdminPinChange(a.id)}>পরিবর্তনের অনুরোধ পাঠান</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      <div className="sp-footer">জমার ঘরে ক্লিক করে মার্ক করা যায় শুধু অ্যাডমিন মোডে</div>

      {showPinModal && (
        <div className="sp-modal-overlay" onClick={() => setShowPinModal(false)}>
          <div className="sp-modal" onClick={(e) => e.stopPropagation()}>
            <div className="sp-modal-title">অ্যাডমিন পিন দিন</div>
            <input className="sp-pin-input" type="password" inputMode="numeric" autoFocus value={pinInput} onChange={(e) => { setPinInput(e.target.value); setPinError(""); }} onKeyDown={(e) => e.key === "Enter" && tryAdminUnlock()} />
            {pinError && <div className="sp-pin-error">{pinError}</div>}
            <div className="sp-modal-actions"><button className="sp-btn sp-btn-ghost" onClick={() => setShowPinModal(false)}>বাতিল</button><button className="sp-btn" onClick={tryAdminUnlock}>প্রবেশ করুন</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SevenPanda />);
</script>
</body>
</html>
